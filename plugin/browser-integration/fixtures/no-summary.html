<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Synth fixture: turn without a summary row (window-cut)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #fff; color: #111; }
    [data-conversation-scroll] { height: 80vh; overflow-y: auto; }
    [data-chat-anchor-key] { padding: 4px 14px; }
    .user-msg { color: #888; font-style: italic; background: #fafafa; }
    .tool-call { color: #06c; }
    .final-answer { background: #fffbe6; padding: 10px 14px; margin: 6px 0; border-left: 3px solid #f90; }
    [data-dsh-ta-collapsed="true"] { display: none !important; }
    [data-dsh-ta-final-collapsed="true"] [data-variant="think"] { display: none !important; }
    .dsh-ta-animating { transition: height 220ms ease, margin-bottom 220ms ease, opacity 150ms ease; overflow: hidden; }
  </style>
</head>
<body>
  <div data-conversation-scroll>
    <div data-chat-flow="synth-flow-A">
      <!-- Turn 0: NO summary row. The projector must synthesise a fold bar
           via synth.ts (computeSyntheticSummaries) so the activity rows
           stay foldable. -->
      <div data-chat-anchor-key="9:turn-head0" class="user-msg">user: synth test</div>
      <div data-chat-anchor-key="14:assistant-step0:0">thinking 0.0</div>
      <div data-chat-anchor-key="9:tool-callc0" class="tool-call">tool call: c0</div>
      <div data-chat-anchor-key="9:tool-callc1" class="tool-call">tool call: c1</div>
      <div data-chat-anchor-key="14:assistant-step0:1" class="final-answer">final answer 0</div>
    </div>
  </div>
  <script src="/lib/fixture.js"></script>
</body>
</html>
