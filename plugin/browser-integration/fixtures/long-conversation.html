<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Long-conversation fixture: 1 turn, 100 tool calls</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #fff; color: #111; }
    [data-conversation-scroll] { height: 80vh; overflow-y: auto; }
    [data-chat-anchor-key] { padding: 4px 14px; }
    .user-msg { color: #888; font-style: italic; background: #fafafa; }
    .tool-call { color: #06c; }
    .final-answer { background: #fffbe6; padding: 10px 14px; margin: 6px 0; border-left: 3px solid #f90; }
    .dsh-ta-root { margin: 8px 14px; padding: 6px 10px; background: #f4f4f4; border: 1px solid #e0e0e0; border-radius: 4px; }
    .dsh-ta-toggle { cursor: pointer; background: none; border: none; padding: 0; font: inherit; color: inherit; }
    .dsh-ta-divider { border-top: 1px solid #e0e0e0; margin-top: 6px; }
    [data-dsh-ta-collapsed="true"] { display: none !important; }
    [data-dsh-ta-final-collapsed="true"] [data-variant="think"] { display: none !important; }
    .dsh-ta-animating { transition: height 220ms ease, margin-bottom 220ms ease, opacity 150ms ease; overflow: hidden; }
  </style>
</head>
<body>
  <div data-conversation-scroll>
    <div data-chat-flow="long-flow-A" id="flow"></div>
  </div>
  <script>
    // 1 turn, 100 tool calls. Activity rows are 100 tool-call rows + 1 final
    // step; the summary row sits at the end and is auto-collapsed by the
    // fixture entry. Programmatic generation keeps the source HTML readable
    // and lets the spec tweak row counts if needed.
    (function buildLongConversation() {
      const flow = document.getElementById('flow');
      const ROWS = 100;
      const TURN = 0;
      const finalStep = ROWS + 1; // step indices 0..ROWS, final is ROWS+1
      const toolCallIds = [];
      for (let i = 0; i < ROWS; i++) toolCallIds.push('c' + i);

      const head = document.createElement('div');
      head.setAttribute('data-chat-anchor-key', '9:turn-head' + TURN);
      head.className = 'user-msg';
      head.textContent = 'user: long turn (100 tool calls)';
      flow.appendChild(head);

      // One thinking step + every tool call + the final step.
      const think = document.createElement('div');
      think.setAttribute('data-chat-anchor-key', '14:assistant-step' + TURN + ':0');
      think.textContent = 'thinking step 0';
      flow.appendChild(think);

      for (let i = 0; i < ROWS; i++) {
        const tool = document.createElement('div');
        tool.setAttribute('data-chat-anchor-key', '9:tool-callc' + i);
        tool.className = 'tool-call';
        tool.textContent = 'tool call: c' + i;
        flow.appendChild(tool);
      }

      const finalRow = document.createElement('div');
      finalRow.setAttribute('data-chat-anchor-key', '14:assistant-step' + TURN + ':' + finalStep);
      finalRow.className = 'final-answer';
      const thinkInline = document.createElement('div');
      thinkInline.setAttribute('data-variant', 'think');
      thinkInline.textContent = 'final thinking';
      finalRow.appendChild(thinkInline);
      finalRow.appendChild(document.createTextNode(' final answer'));
      flow.appendChild(finalRow);

      const root = document.createElement('div');
      root.className = 'dsh-ta-root';
      root.setAttribute('data-dsh-ta-turn', String(TURN));
      root.setAttribute('data-dsh-ta-final-step', String(finalStep));
      root.setAttribute('data-dsh-ta-tools', toolCallIds.join(','));
      root.setAttribute('data-dsh-ta-thinking', '1');
      root.setAttribute('data-dsh-ta-duration', '120000');
      root.setAttribute('data-dsh-ta-session', 'fixture-session');
      root.setAttribute('data-dsh-ta-auto-collapse', 'true');
      const btn = document.createElement('button');
      btn.className = 'dsh-ta-toggle';
      btn.setAttribute('data-dsh-ta-turn', String(TURN));
      btn.setAttribute('data-dsh-ta-session', 'fixture-session');
      btn.setAttribute('aria-expanded', 'false');
      const label = document.createElement('span');
      label.className = 'dsh-ta-label';
      label.textContent = 'long-turn summary (100 tool calls)';
      btn.appendChild(label);
      root.appendChild(btn);
      const divider = document.createElement('div');
      divider.className = 'dsh-ta-divider';
      divider.setAttribute('role', 'separator');
      root.appendChild(divider);
      flow.appendChild(root);
    })();
  </script>
  <script src="/lib/fixture.js"></script>
</body>
</html>
